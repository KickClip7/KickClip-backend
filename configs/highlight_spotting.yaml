inference:
  mode: real
  allow_fallback_when_missing: false
  strict_real_model: true
  model_adapter: soccer_highlight_former_champion
  device: auto
  model:
    model_dir: storage/models/action_spotting/sampling_v1_loss_v2_ms_stem_v1
    checkpoint_file: transformer_best.pt
    model_config_file: model.yaml
    train_config_file: train.yaml
    config_snapshot_file: config_snapshot.yaml
    inference_policy_file: inference_policy.yaml
    manifest_file: manifest.yaml
  expected_feature_asset_types:
    - SOCCERNET_FEATURE_HALF1
    - SOCCERNET_FEATURE_HALF2
  raw_video_fallback_enabled: false

postprocess:
  # These four values are copied from the Champion validation evaluation and
  # are validated at startup. Per-class threshold overrides are not defined.
  default_threshold: 0.20
  max_candidates: 80
  nms_window_sec: 10.0
  class_thresholds: {}
  class_aware_nms: true
  apply_offset: true

  # Backend scene-window policy. This is separate from model event decoding.
  merge_overlapping_scenes: true
  min_duration_sec: 4.0
  max_duration_sec: 12.0
  pre_event_sec: 4.0
  post_event_sec: 4.0
  class_priority:
    goal: 100
    shot: 80
    free_kick: 70
    corner: 60
    foul: 50
    card: 40

ranking:
  default_top_k: 20
  max_top_k: 50

label_display:
  goal:
    tag: GOAL
    title_prefix: GOAL
  shot:
    tag: SHOT
    title_prefix: SHOT
  foul:
    tag: FOUL
    title_prefix: FOUL
  card:
    tag: CARD
    title_prefix: CARD
  free_kick:
    tag: FREE KICK
    title_prefix: FREE KICK
  corner:
    tag: CORNER
    title_prefix: CORNER
