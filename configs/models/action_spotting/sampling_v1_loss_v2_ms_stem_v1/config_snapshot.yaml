data_config:
  project:
    name: KickClip
    model_name: SoccerHighlightFormer
  soccernet:
    root_dir: ./SoccerNet
    half1_feature_name: 1_ResNET_TF2_PCA512.npy
    half2_feature_name: 2_ResNET_TF2_PCA512.npy
    label_file_name: Labels-v2.json
  feature:
    dim: 512
    fps: 2.0
  labels:
    num_classes: 6
    classes:
    - goal
    - shot
    - foul
    - card
    - free_kick
    - corner
    label_to_id:
      goal: 0
      shot: 1
      foul: 2
      card: 3
      free_kick: 4
      corner: 5
    id_to_label:
      0: goal
      1: shot
      2: foul
      3: card
      4: free_kick
      5: corner
  label_mapping:
    Goal: goal
    Shots on target: shot
    Shots off target: shot
    Foul: foul
    Yellow card: card
    Red card: card
    Yellow->red card: card
    Direct free-kick: free_kick
    Indirect free-kick: free_kick
    Corner: corner
  window:
    window_sec: 64
    stride_sec: 16
    window_size: 128
    stride_size: 32
  target:
    heatmap_sigma_sec: 2.0
    positive_radius_sec: 4.0
  sampling:
    positive_event_centered_ratio: 0.6
    hard_negative_ratio: 0.2
    random_negative_ratio: 0.2
  paths:
    scan_result_path: ./storage/cache/scan_result.json
    dataset_index_path: ./storage/cache/dataset_index.json
model_config:
  model:
    name: SoccerHighlightFormer
    type: soccer_highlight_former
    input_dim: 512
    num_classes: 6
  temporal_cnn:
    input_dim: 512
    hidden_dim: 256
    num_classes: 6
    num_layers: 4
    kernel_size: 3
    dropout: 0.1
    use_offset_head: true
    use_highlight_score_head: false
  soccer_highlight_former:
    input_dim: 512
    d_model: 256
    num_classes: 6
    projection:
      use_layer_norm: true
      dropout: 0.1
    temporal_stem:
      enabled: true
      type: multi_scale
      kernel_size: 3
      num_layers: 2
      dropout: 0.1
      multi_scale_kernel_sizes:
      - 3
      - 5
      - 9
      multi_scale_use_depthwise: true
      multi_scale_use_residual: true
      multi_scale_activation: gelu
    transformer:
      num_layers: 4
      num_heads: 8
      dim_feedforward: 1024
      dropout: 0.1
      activation: gelu
      batch_first: true
    positional_encoding:
      type: sinusoidal
      max_len: 4096
    heads:
      use_heatmap_head: true
      use_offset_head: true
      use_highlight_score_head: false
train_config:
  experiment:
    name: sampling_v1_loss_v2_ms_stem_v1
    description: '29회차 모델 구조 개선 실험. sampling_v1 + loss_v2 설정은 유지하고, SoccerHighlightFormer의
      temporal stem만 multi-scale convolution stem으로 교체한다. 목표는 free_kick/shot/foul처럼
      전후 문맥이 중요한 이벤트의 AP와 Recall@Top20을 개선하는 것이다.

      '
  train:
    seed: 42
    device: auto
    epochs: 30
    batch_size: 32
    num_workers: 0
    log_interval: 20
    validation_interval: 1
    gradient_clip_norm: 1.0
    mixed_precision:
      enabled: false
  optimizer:
    name: adamw
    lr: 0.0003
    weight_decay: 0.01
  scheduler:
    name: cosine
    warmup_epochs: 3
    min_lr: 1.0e-06
  loss:
    heatmap_loss: focal_bce
    offset_loss: smooth_l1
    heatmap_loss_weight: 1.0
    offset_loss_weight: 0.3
    focal:
      gamma: 2.0
      alpha: auto
    positive_label_smoothing: 0.0
    class_weight:
      enabled: true
      formula: 1 / log(1.2 + count_c)
      normalize: true
      override_mode: multiply
      min: 0.25
      max: 4.0
      override:
        goal: 1.0
        shot: 1.0
        foul: 0.95
        card: 1.0
        free_kick: 1.15
        corner: 1.0
  dataset:
    dataset_index_path: ./storage/cache/dataset_index_linux.json
    feature_fps: 2.0
    window_sec: 64
    window_size: 128
    stride_sec: 16
    stride_size: 32
    heatmap_sigma_sec: 2.0
    positive_radius_sec: 4.0
    sampling:
      positive_event_centered_ratio: 0.7
      hard_negative_ratio: 0.2
      random_negative_ratio: 0.1
      hard_negative_context_sec: 45.0
      max_negative_only_samples: 256
      class_positive_multipliers:
        goal: 2
        shot: 3
        foul: 1
        card: 6
        free_kick: 4
        corner: 3
      positive_jitter_sec_by_class:
        goal:
        - -8
        - -4
        - 4
        - 8
        shot:
        - -10
        - -5
        - 5
        - 10
        foul:
        - -6
        - 6
        card:
        - -12
        - -6
        - 6
        - 12
        free_kick:
        - -10
        - -5
        - 5
        - 10
        corner:
        - -10
        - -5
        - 5
        - 10
      hard_negative_class_multipliers:
        goal: 2
        shot: 3
        foul: 3
        card: 2
        free_kick: 3
        corner: 2
  split:
    train_ratio: 0.8
    valid_ratio: 0.1
    test_ratio: 0.1
    split_unit: match
  checkpoint:
    dir: ./storage/checkpoints_sampling_v1_loss_v2_ms_stem_v1
    save_last: true
    save_best: true
    monitor: valid_loss
    mode: min
  output:
    log_dir: ./storage/logs_sampling_v1_loss_v2_ms_stem_v1
dataset_config:
  feature_fps: 2.0
  window_size: 128
  stride_size: 32
  num_classes: 6
  heatmap_sigma_sec: 2.0
  positive_radius_sec: 4.0
  positive_event_centered_ratio: 0.7
  hard_negative_ratio: 0.2
  random_negative_ratio: 0.1
  hard_negative_context_sec: 45.0
  class_positive_multipliers:
    goal: 2
    shot: 3
    foul: 1
    card: 6
    free_kick: 4
    corner: 3
  positive_jitter_sec_by_class:
    goal:
    - -8
    - -4
    - 4
    - 8
    shot:
    - -10
    - -5
    - 5
    - 10
    foul:
    - -6
    - 6
    card:
    - -12
    - -6
    - 6
    - 12
    free_kick:
    - -10
    - -5
    - 5
    - 10
    corner:
    - -10
    - -5
    - 5
    - 10
  hard_negative_class_multipliers:
    goal: 2
    shot: 3
    foul: 3
    card: 2
    free_kick: 3
    corner: 2
  seed: 42
  max_samples: null
  max_negative_only_samples: 256
debug_small_model: false
regimen_config:
  gradient_accumulation_steps: 1
  mixed_precision:
    enabled: false
    dtype: float16
  early_stopping:
    enabled: false
    monitor: valid_loss
    mode: min
    patience: 8
    min_delta: 0.0
  save_history_every_epoch: true
  save_config_snapshot: true
